name: coed-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: coed_local_only
      POSTGRES_DB: coed_dev
    ports:
      - "127.0.0.1:${CO_ED_LOCAL_DB_PORT:-54329}:5432"
    volumes:
      - local-postgres:/var/lib/postgresql/data
      - ./scripts/local-dev/init.sql:/docker-entrypoint-initdb.d/01-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coed_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  local-postgres:
