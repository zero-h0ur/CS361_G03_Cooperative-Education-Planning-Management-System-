name: V4 verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coed_v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coed_v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      ALLOW_DB_RESET: 'true'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_unused
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_v3_test
      CO_ED_WORKFLOW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_v3_test
      CO_ED_SELECTION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_selection_test
      CO_ED_APPLICATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_v3_test
      COORDINATOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_v3_test
      TU_DELIVERY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_v3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare isolated selection test database
        run: |
          node - <<'JS'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.TEST_DATABASE_URL });
            try {
              await client.connect();
              await client.query('CREATE DATABASE coed_selection_test');
            } finally { await client.end(); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Verify read-only browse allowlist and disabled Student actions
        run: npm run test:read-only-browse
      - name: Verify observed-schema tooling and immutable source contracts without AWS
        run: npm run test:observed-upgrade:unit
      - name: Verify published documentation links without network access
        shell: bash
        run: |
          set -o pipefail
          npm run test:docs 2>&1 | tee docs-verification.log
      - name: Verify smoke operator safety without AWS access
        shell: bash
        env:
          CO_ED_TEST_DOCKER_PROVISION: '1'
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/operations -p 'test_*.py' 2>&1 | tee smoke-operator-verification.log
      - name: Run full regression including auth boundaries and PostgreSQL integration
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee v4-verification.log
      - name: Verify isolated UI Preview
        run: npm run test:ui-preview
      - name: Verify Coordinator workspace and correction-window integration
        run: npm run test:coordinator
      - name: Verify main schedule integration and TU transport boundaries
        run: npm run test:phase1-schedule
      - name: Verify team local setup and signed test identities
        env:
          CO_ED_LOCAL_DEV_TESTS: '1'
        run: |
          docker compose -f compose.dev.yml up -d --wait
          npm run test:local-dev
      - name: Stop disposable team development database
        if: always()
        run: docker compose -f compose.dev.yml down -v
      - name: Build for the new AWS account with strict production authentication
        run: npm run build:v4
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v4-verification.log
            smoke-operator-verification.log
            docs-verification.log
          if-no-files-found: warn
          retention-days: 14

  observed-schema-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coed_present_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coed_present_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PRESENT_SCHEMA_DISPOSABLE: 'true'
      PRESENT_SCHEMA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55440/coed_present_test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55440/coed_unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify observed upgrade preservation, rollback and Student-to-Coordinator HTTP flow
        run: npm run test:observed-upgrade
      - name: Prepare empty disposable owner-login fixture database
        run: |
          node --input-type=module - <<'JS'
          import pg from 'pg';
          const client=new pg.Client({connectionString:process.env.PRESENT_SCHEMA_TEST_DATABASE_URL});
          await client.connect();
          await client.query('CREATE DATABASE coed');
          await client.end();
          JS
      - name: Verify production tooling offline and SELECT-only credential on disposable PostgreSQL
        env:
          OWNER_TOOL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55440/coed
        run: npm run test:production-tooling
