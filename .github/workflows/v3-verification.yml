name: V3 verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coed_v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coed_v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      ALLOW_DB_RESET: 'true'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_unused
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_v3_test
      CO_ED_WORKFLOW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coed_v3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Verify published documentation links without network access
        shell: bash
        run: |
          set -o pipefail
          npm run test:docs 2>&1 | tee docs-verification.log
      - name: Verify smoke operator safety without AWS access
        shell: bash
        env:
          CO_ED_TEST_DOCKER_PROVISION: '1'
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/operations -p 'test_*.py' 2>&1 | tee smoke-operator-verification.log
      - name: Run full regression including auth boundaries and PostgreSQL integration
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee v3-verification.log
      - name: Verify isolated UI Preview
        run: npm run test:ui-preview
      - name: Build with strict production authentication configuration
        env:
          NODE_ENV: production
          CO_ED_REQUIRE_AUTH_CONFIG: '1'
          CO_ED_COGNITO_USER_POOL_ID: us-east-1_WzzG10dCP
          CO_ED_COGNITO_CLIENT_ID: 3r7a2qjn98v31r1f6vee8ag8e5
          CO_ED_COGNITO_DOMAIN: us-east-1wzzg10dcp.auth.us-east-1.amazoncognito.com
          CO_ED_APP_ORIGIN: https://main.d1d9qrqnsi5nl6.amplifyapp.com
          CO_ED_API_BASE_URL: https://qtqlsb1aec.execute-api.us-east-1.amazonaws.com
        run: npm run build
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v3-verification.log
            smoke-operator-verification.log
            docs-verification.log
          if-no-files-found: warn
          retention-days: 14
