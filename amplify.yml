version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # NODE_ENV is scoped to the build step only so `npm ci` still installs esbuild/aws-amplify
        # TEMPORARY: strict auth config (CO_ED_REQUIRE_AUTH_CONFIG=1) is off until the Cognito
        # callback/sign-out URLs and Amplify env vars are set (docs/frontend/v3-authenticated-shell.md).
        # Without them app.html fails closed with "Configuration required"; public pages still deploy.
        # Re-enable it as: NODE_ENV=production CO_ED_REQUIRE_AUTH_CONFIG=1 npm run build
        - NODE_ENV=production npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
