version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # NODE_ENV is scoped to the build step only so `npm ci` still installs esbuild/aws-amplify
        - NODE_ENV=production CO_ED_REQUIRE_AUTH_CONFIG=1 npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
